name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect and Configure Node CI Compatibility
      run: |
        chmod +x ./scripts/detect-node-compat.sh || true
        ./scripts/detect-node-compat.sh

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
        cache-read-only: false
        validate-wrappers: false

    - name: Ensure Gradle Wrapper matches AGP 8.7.3 requirements
      run: |
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        echo "Validated Gradle Wrapper for AGP 8.7.3 & JDK 17:"
        cat android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Sync App Version from package.json
      run: npm run sync:version

    - name: Verify Gradle & Java Version Consistency
      run: npm run verify:gradle

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
