name: Android Build & APK Generation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect and Configure Node CI Compatibility
      run: |
        chmod +x ./scripts/detect-node-compat.sh || true
        ./scripts/detect-node-compat.sh

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
        cache-read-only: false
        validate-wrappers: false

    - name: Ensure Authentic Gradle Wrapper
      run: |
        cd android
        mkdir -p gradle/wrapper
        gradle wrapper --gradle-version 8.11.1 --distribution-type all
        chmod +x gradlew
        echo "Validated Gradle Wrapper:"
        ls -la gradle/wrapper/
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Sync App Version from package.json
      run: npm run sync:version

    - name: Verify Gradle & Java Version Consistency
      run: npm run verify:gradle

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Clean Gradle Build Artifacts
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean --no-daemon || gradle clean --no-daemon

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
