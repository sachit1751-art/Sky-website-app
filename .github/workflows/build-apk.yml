name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect and Configure Node CI Compatibility
      run: |
        chmod +x ./scripts/detect-node-compat.sh || true
        ./scripts/detect-node-compat.sh

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Set up JDK 21 (JavaVersion.VERSION_21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
        cache-read-only: false

    - name: Ensure Gradle Wrapper matches AGP 8.7.3 requirements
      run: |
        mkdir -p android/gradle/wrapper
        cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        echo "Validated Gradle Wrapper for AGP 8.7.3:"
        cat android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: npm install

    - name: Debug Dependencies & Node Modules
      run: |
        echo "=== package.json contents ==="
        cat package.json
        echo ""
        echo "=== Top-level node_modules ==="
        ls -la node_modules/
        echo ""
        echo "=== Key Capacitor Packages ==="
        ls -la node_modules/@capacitor/ || true

    - name: Build Web Application
      run: npm run build

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync App Version from package.json
      run: npm run sync:version

    - name: Verify Gradle & Java Version Consistency
      run: npm run verify:gradle

    - name: Verify Resolved Capacitor Plugins & Native Dependencies
      run: |
        echo "=== Installed Capacitor Plugins ==="
        npm list --depth=0 | grep -E "(@capacitor|capacitor)" || true
        echo ""
        echo "=== Capacitor Discovered Native Plugins ==="
        npx cap ls android || npx cap ls || true

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Clean Gradle Build Cache
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean --no-daemon

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
