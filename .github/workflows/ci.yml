name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Detect and Configure Node CI Compatibility
      run: |
        chmod +x ./scripts/detect-node-compat.sh || true
        ./scripts/detect-node-compat.sh

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Type Check & Lint
      run: npm run lint

    - name: Build Application
      run: npm run build
